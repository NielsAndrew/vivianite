plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "Ladysnake Mods"
		url = 'https://maven.ladysnake.org/releases'
	}
	maven {
		name = "JamiesWhiteShirt"
		url = "https://maven.jamieswhiteshirt.com/libs-release"
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "vivianite"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	//Mod menu cause yes
	modImplementation "com.terraformersmc:modmenu:7.2.2"
	//Amarite and Co.
	modImplementation "maven.modrinth:ftofxBty:avD3BFrw"
	modRuntimeOnly "maven.modrinth:trinkets:3.7.2"
	modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.2"
	modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.2"
	modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-block:5.2.2"
	modImplementation "com.jamieswhiteshirt:reach-entity-attributes:2.4.0"
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.

